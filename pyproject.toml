[project]
name = "modular-rnn"
version = "0.1.0"
description = "Modular CTRNN (VISp/MOs) model of the IBL decision-making task"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "dkundu" }
]

dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "einops>=0.7",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.16",
    "zarr>=2.16",
    "xarray>=2023.1",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.90",
    "ruff>=0.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["modularRNN*"]

[tool.ruff]
line-length = 100
target-version = "py310"